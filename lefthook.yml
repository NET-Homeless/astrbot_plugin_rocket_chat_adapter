# Lefthook Git Hooks Configuration
# 用于在 git commit 前自动运行代码格式化和质量检查
# 类似 cargo clippy 的 pre-commit gate
#
# 安装方法:
#   macOS: brew install lefthook
#   或: curl -sSfL https://raw.githubusercontent.com/evilmartians/lefthook/master/install.sh | sh
#   然后在本仓库根目录运行: lefthook install
#
# 卸载 hooks: lefthook uninstall

pre-commit:
  parallel: false
  commands:
    # Ruff 代码检查 + 自动修复（仅检查暂存文件，速度快）
    # 自动修复的问题会重新暂存
    ruff-check:
      glob: "*.py"
      run: ruff check --fix {staged_files}
      stage_fixed: true
      fail_text: "Ruff lint 检查失败。请修复上述问题后再提交。"

    # Ruff 格式化（仅格式化暂存文件）
    ruff-format:
      glob: "*.py"
      run: ruff format {staged_files}
      stage_fixed: true
      fail_text: "Ruff format 格式化失败。"

    # Pyright 类型检查（仅检查核心库代码，避免测试 bootstrap 导致的误报）
    # 测试目录使用动态 mock，单独跑 pyright 会报 import 错误，这是预期行为。
    # CI 中会用更完整的环境验证。
    pyright:
      run: pyright rocketchat_*.py main.py
      fail_text: "Pyright 类型检查失败。请修复类型错误后再提交。"

    # 单元测试 gate：命令与 CI（release.yml 的 test job）保持一致，
    # 避免"本地没跑测试 → 提交后 CI 才暴露失败"。测试为纯 mock、约 0.1s，
    # 仅在改动涉及 Python 文件时运行（glob 命中才执行）。
    unittest:
      glob: "*.py"
      run: python3 -m unittest discover -s tests -p "test_*.py"
      fail_text: "单元测试失败。请修复后再提交（命令与 CI 对齐）。"

  # 可选：如果需要跳过某些文件或目录，可以在这里配置
  # exclude:
  #   - "tests/**"
