name: Dependabot auto-merge

# Dependabot PR 自动合并策略：
# - pip 依赖：仅 patch / minor 升级自动合并，major 升级留给人工评审
# - GitHub Actions：全部升级自动合并（action 的 major 版本升级常见且由 CI 验证）
# 实际合并动作由 GitHub auto-merge 执行，仍受分支保护约束：
# `quality` 检查（.github/workflows/ci.yml）不通过就不会合并。

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' ||
          startsWith(github.head_ref, 'dependabot/github_actions/')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
