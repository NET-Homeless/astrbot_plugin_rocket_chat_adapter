version: 2
updates:
  # Python 依赖（requirements.txt）
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    # dev 依赖（requirements-dev.txt）镜像 AstrBot 本体，忽略 major 升级，
    # 仅跟进 patch/minor，避免测试版本过度领先本体运行版本
    ignore:
      - dependency-name: "aiohttp"
        update-types: ["version-update:semver-major"]
      - dependency-name: "cryptography"
        update-types: ["version-update:semver-major"]

  # GitHub Actions（.github/workflows/）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
